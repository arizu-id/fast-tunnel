name: CI Pipeline
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
jobs:
  php-lint-and-validate:
    name: PHP ${{ matrix.php-version }} Syntax & Composer Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, openssl, json, curl, zip
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Cache Composer Dependencies
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Vendor Directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Check PHP Syntax (Linting)
        run: |
          errors=0
          for file in $(find . -name "*.php" ! -path "./vendor/*"); do
            php -l "$file" || errors=$((errors+1))
          done
          if [ $errors -ne 0 ]; then
            echo "Linting failed with $errors error(s)."
            exit 1
          fi
          echo "All PHP files passed syntax validation."
