server {
    listen 80;
    server_name your-domain.com;
    root /var/www/html/fast-tunnel;
    index index.php index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log /var/log/nginx/fast_tunnel_access.log;
    error_log /var/log/nginx/fast_tunnel_error.log warn;
    client_max_body_size 100M;
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ ^/(backend|plugins|temp_ssh|scratch|documentation)/.*\.php$ {
        deny all;
        return 403;
    }
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* (config\.php|installed\.lock|\.json\.bak)$ {
        deny all;
        return 403;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
